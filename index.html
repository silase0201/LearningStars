<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#020b24">
  <title>孩子的學習星球｜純插圖版</title>
  <link rel="stylesheet" href="css/style.css?v=1">
</head>
<body>
  <main class="app" aria-label="孩子的學習星球測驗">
    <section class="quiz" id="quiz" aria-labelledby="pageTitle">
      <h1 class="sr-only" id="pageTitle"></h1>
      <div class="quiz-content">
        <section class="scene" aria-label="關卡情境">
          <picture>
            <source id="sceneWebp" type="image/webp">
            <img id="sceneImage" width="1200" height="720" alt="" fetchpriority="high">
          </picture>
          <button class="back-button" id="backButton" type="button" aria-label="上一題"><span aria-hidden="true">‹</span></button>
        </section>

        <section class="question-area" aria-label="問題與選項">
          <div class="prompt" id="prompt">
            <span class="prompt-icon" id="promptIcon" aria-hidden="true"></span>
            <p><span id="promptLead"></span><strong id="promptHighlight"></strong></p>
          </div>

          <div class="choices" id="choices" role="radiogroup" aria-label="答案選項">
            <button class="choice" type="button" role="radio" aria-checked="false" data-option="A">
              <span class="choice-heading"><span class="choice-letter">A</span><strong class="choice-title"></strong></span>
              <picture class="choice-art"><source type="image/webp"><img width="1000" height="400" alt=""></picture>
              <span class="choice-description"></span>
            </button>
            <button class="choice" type="button" role="radio" aria-checked="false" data-option="B">
              <span class="choice-heading"><span class="choice-letter">B</span><strong class="choice-title"></strong></span>
              <picture class="choice-art"><source type="image/webp"><img width="1000" height="400" alt=""></picture>
              <span class="choice-description"></span>
            </button>
            <button class="choice" type="button" role="radio" aria-checked="false" data-option="C">
              <span class="choice-heading"><span class="choice-letter">C</span><strong class="choice-title"></strong></span>
              <picture class="choice-art"><source type="image/webp"><img width="1000" height="400" alt=""></picture>
              <span class="choice-description"></span>
            </button>
            <button class="choice" type="button" role="radio" aria-checked="false" data-option="D">
              <span class="choice-heading"><span class="choice-letter">D</span><strong class="choice-title"></strong></span>
              <picture class="choice-art"><source type="image/webp"><img width="1000" height="400" alt=""></picture>
              <span class="choice-description"></span>
            </button>
          </div>
        </section>
      </div>

      <footer class="quiz-footer">
        <div class="progress-label" aria-hidden="true"><span class="star">★</span><strong id="progressCount">1/6</strong></div>
        <nav class="progress" id="progress" aria-label="題目進度">
          <button type="button" data-question="0" aria-label="前往第 1 題"></button>
          <button type="button" data-question="1" aria-label="前往第 2 題"></button>
          <button type="button" data-question="2" aria-label="前往第 3 題"></button>
          <button type="button" data-question="3" aria-label="前往第 4 題"></button>
          <button type="button" data-question="4" aria-label="前往第 5 題"></button>
          <button type="button" data-question="5" aria-label="前往第 6 題"></button>
        </nav>
        <button class="next-button" id="nextButton" type="button"><span id="nextText">選好了</span><span aria-hidden="true">→</span></button>
      </footer>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </section>

    <section class="completion" id="completion" hidden aria-labelledby="completionTitle">
      <div class="completion-card">
        <span class="completion-star" aria-hidden="true">★</span>
        <h2 id="completionTitle">探索完成！</h2>
        <p>你已經找到了孩子的學習星。</p>
        <div class="answer-summary" id="answerSummary" aria-label="作答結果"></div>
        <div class="completion-actions"><button id="reviewButton" type="button">回到第一題</button><button id="restartButton" type="button">重新作答</button></div>
      </div>
    </section>
  </main>
  <noscript>此頁面需要啟用 JavaScript 才能切換題目與記錄選項。</noscript>
  <script src="js/app.js" defer></script>
</body>
</html>
